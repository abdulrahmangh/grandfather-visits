<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>زيارات جدّي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3ef;--card:#fff;--ink:#16302b;--mute:#5d726c;--line:#d5e0da;--pri:#0f6b5c;--pri-ink:#fff;--warn-bg:#fdf1d8;--warn:#8a5a00;--today:#e3f2ec}
@media (prefers-color-scheme:dark){:root{--bg:#10201c;--card:#182b26;--ink:#e8f1ed;--mute:#9db3ab;--line:#2b423b;--pri:#3fb89f;--pri-ink:#06211b;--warn-bg:#3a2e12;--warn:#f0c46a;--today:#1d3a32}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;font-size:17px;line-height:1.6;padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{padding:28px 0 12px}
h1{margin:0;font-size:30px;font-weight:800;line-height:1.25}
header p{margin:6px 0 0;color:var(--mute)}
.demo{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:14px}
.day{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:12px 0;padding:14px 16px}
.day.today{background:var(--today);border-color:var(--pri)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dh b{font-size:19px}
.dh small{color:var(--mute);font-size:14px}
.alone{margin:10px 0 2px;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:15px;font-weight:500}
.v{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px dashed var(--line);margin-top:10px}
.v:first-of-type{margin-top:10px}
.t{min-width:74px;font-weight:700;color:var(--pri)}
.v .b{flex:1}
.v .n{font-weight:700}
.v .r{color:var(--mute);font-size:15px;overflow-wrap:anywhere}
.x{border:0;background:none;color:var(--mute);font:inherit;font-size:14px;padding:6px 4px;cursor:pointer;text-decoration:underline}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.fab{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:528px;margin:0 auto;background:var(--pri);color:var(--pri-ink);border:0;border-radius:16px;padding:16px;font:inherit;font-size:19px;font-weight:800;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.mini{background:none;border:1.5px solid var(--pri);color:var(--pri);border-radius:10px;padding:4px 12px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
dialog{border:0;border-radius:20px 20px 0 0;padding:0;width:100%;max-width:560px;margin:auto auto 0;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
form{padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
form h2{margin:0 0 12px;font-size:22px}
label{display:block;font-weight:700;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
textarea{min-height:76px;resize:vertical}
.row{display:flex;gap:10px}.row>div{flex:1}
.go{width:100%;margin-top:18px;background:var(--pri);color:var(--pri-ink);border:0;border-radius:14px;padding:14px;font:inherit;font-size:18px;font-weight:800;cursor:pointer}
.no{width:100%;margin-top:8px;background:none;border:0;color:var(--mute);font:inherit;padding:10px;cursor:pointer}
.err{color:#b3261e;margin-top:10px;font-weight:500}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>من سيزور جدّي؟</h1>
    <p>اختر يومًا وأضف زيارتك حتى لا يبقى وحده.</p>
    <div id="demo" class="demo" hidden>وضع تجريبي: الزيارات تُحفظ على هذا الجهاز فقط. اربط قاعدة البيانات لتظهر للجميع.</div>
  </header>
  <main id="days"></main>
</div>
<button class="fab" id="open">+ أضف زيارتك</button>

<dialog id="dlg">
  <form id="f">
    <h2>زيارة جديدة</h2>
    <label for="name">اسمك</label>
    <input id="name" required maxlength="40" autocomplete="name" placeholder="مثال: أبو خالد">
    <div class="row">
      <div><label for="date">اليوم</label><select id="date" required></select></div>
      <div><label for="time">الساعة</label><input id="time" type="time" required value="17:00"></div>
    </div>
    <label for="note">ملاحظة (اختياري)</label>
    <textarea id="note" maxlength="200" placeholder="مثال: سأحضر مع زوجتي وأولادي"></textarea>
    <div id="err" class="err" hidden></div>
    <button class="go" type="submit" id="save">حفظ الزيارة</button>
    <button class="no" type="button" id="cancel">إلغاء</button>
  </form>
</dialog>

<script>
// ===== الإعدادات: عدّل هذه القيم فقط =====
const START_DATE = "2026-10-05"; // أول يوم يكون فيه جدّي وحده (سنة-شهر-يوم)
const DAYS = 30;                 // عدد الأيام
const SUPABASE_URL = "https://ysofnwjngkorfqdofhym.supabase.co";
const SUPABASE_KEY = "sb_publishable_XC668QWi80mUDp6Ae2ZSQA_BKL0u45h";
// ==========================================

const live = !!(SUPABASE_URL && SUPABASE_KEY);
const $ = id => document.getElementById(id);
const store = { get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}, set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}} };
const mine = new Set(store.get("mine", []));
let visits = [];

const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const days = Array.from({length:DAYS},(_,i)=>{const d=parse(START_DATE);d.setDate(d.getDate()+i);return d;});
const fmtDay = d => d.toLocaleDateString("ar-u-ca-gregory",{weekday:"long"});
const fmtDate = d => d.toLocaleDateString("ar-u-ca-gregory",{day:"numeric",month:"long"});
const fmtTime = t => { const [h,m]=t.split(":").map(Number); return new Date(2000,0,1,h,m).toLocaleTimeString("ar",{hour:"numeric",minute:"2-digit",hour12:true}); };

function h(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }

async function api(path, opts={}){
  const r = await fetch(SUPABASE_URL+"/rest/v1/"+path, {...opts, headers:{apikey:SUPABASE_KEY,...(SUPABASE_KEY.startsWith("eyJ")?{Authorization:"Bearer "+SUPABASE_KEY}:{}),"Content-Type":"application/json",Prefer:"return=representation",...(opts.headers||{})}});
  if(!r.ok) throw new Error("http "+r.status);
  return r.status===204 ? null : r.json();
}
async function load(){
  try{
    visits = live ? await api("visits?select=*&order=date.asc,time.asc") : store.get("visits", []);
    render();
  }catch(e){ if(!visits.length){ $("days").replaceChildren(h("div","alone","تعذّر تحميل الزيارات. تأكد من الاتصال بالإنترنت ثم أعد فتح الصفحة.")); } }
}
function render(){
  const today = iso(new Date()), out = [];
  for(const d of days){
    const key = iso(d), list = visits.filter(v=>v.date===key).sort((a,b)=>a.time.localeCompare(b.time));
    const card = h("section","day"+(key===today?" today":""));
    const hd = h("div","dh"), left = h("div");
    left.append(h("b",null,fmtDay(d)+(key===today?" (اليوم)":"")), h("br"), h("small",null,fmtDate(d)));
    const add = h("button","mini","+ زيارة"); add.onclick=()=>openForm(key);
    hd.append(left, add); card.append(hd);
    if(!list.length) card.append(h("div","alone","لا أحد حتى الآن. جدّي وحده في هذا اليوم."));
    for(const v of list){
      const row = h("div","v"), b = h("div","b");
      b.append(h("div","n",v.name)); if(v.note) b.append(h("div","r",v.note));
      row.append(h("div","t",fmtTime(v.time)), b);
      if(mine.has(String(v.id))){ const x=h("button","x","حذف"); x.onclick=()=>del(v.id); row.append(x); }
      card.append(row);
    }
    out.push(card);
  }
  $("days").replaceChildren(...out);
}
function openForm(dateKey){
  const sel = $("date"); sel.replaceChildren(...days.map(d=>{const o=h("option",null,fmtDay(d)+" "+fmtDate(d)); o.value=iso(d); return o;}));
  const today = iso(new Date());
  sel.value = dateKey || (days.some(d=>iso(d)===today)?today:iso(days[0]));
  $("name").value = store.get("name","");
  $("note").value = ""; $("err").hidden = true; $("dlg").showModal();
}
async function del(id){
  if(!confirm("هل تريد حذف هذه الزيارة؟")) return;
  try{
    if(live) await api("visits?id=eq."+encodeURIComponent(id),{method:"DELETE"});
    else store.set("visits", visits.filter(v=>String(v.id)!==String(id)));
    mine.delete(String(id)); store.set("mine",[...mine]); await load();
  }catch(e){ alert("تعذّر الحذف، حاول مرة أخرى."); }
}
$("f").onsubmit = async e => {
  e.preventDefault();
  const v = {name:$("name").value.trim(), date:$("date").value, time:$("time").value, note:$("note").value.trim()};
  if(!v.name) return;
  $("save").disabled = true;
  try{
    let id;
    if(live){ const r = await api("visits",{method:"POST",body:JSON.stringify(v)}); id = r[0].id; }
    else { id = Date.now(); store.set("visits",[...visits,{...v,id}]); }
    mine.add(String(id)); store.set("mine",[...mine]); store.set("name",v.name);
    $("dlg").close(); await load();
  }catch(err){ $("err").textContent="تعذّر حفظ الزيارة. تأكد من الاتصال وحاول مرة أخرى."; $("err").hidden=false; }
  $("save").disabled = false;
};
$("open").onclick = () => openForm();
$("cancel").onclick = () => $("dlg").close();
$("demo").hidden = live;
load();
if(live) setInterval(load, 30000);
</script>
</body>
</html>
